name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-basics-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            "LINUX_BASICS.md"
            "scripts/show_sysinfo.sh"
            "scripts/find_large_files.sh"
            "scripts/check_ports.sh"
            "scripts/lint_markdown.sh"
            "scripts/check_markdown_links.sh"
            "scripts/vm_preflight.sh"
            "scripts/smoke_test.sh"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  markdown-and-links:
    name: Markdown lint and link check
    runs-on: ubuntu-latest
    needs: structure-check
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown lint
        run: ./scripts/lint_markdown.sh

      - name: Markdown link check
        run: ./scripts/check_markdown_links.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    needs: markdown-and-links
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Normalize shell file line endings
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 sed -i 's/\r$//'

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  bash-syntax:
    name: Bash syntax validation
    runs-on: ubuntu-latest
    needs: shellcheck
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash -n all scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

  vm-preflight:
    name: VM preflight checks
    runs-on: ubuntu-latest
    needs: bash-syntax
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run preflight in strict mode
        run: ./scripts/vm_preflight.sh --strict

  scripts-smoke:
    name: Script smoke tests
    runs-on: ubuntu-latest
    needs: vm-preflight
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke script
        run: ./scripts/smoke_test.sh

  final-status-gate:
    name: Final status gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - structure-check
      - markdown-and-links
      - shellcheck
      - bash-syntax
      - vm-preflight
      - scripts-smoke
    steps:
      - name: Aggregate results
        shell: bash
        env:
          STRUCTURE: ${{ needs.structure-check.result }}
          MARKDOWN: ${{ needs.markdown-and-links.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          SYNTAX: ${{ needs.bash-syntax.result }}
          PREFLIGHT: ${{ needs.vm-preflight.result }}
          SMOKE: ${{ needs.scripts-smoke.result }}
        run: |
          for result in "$STRUCTURE" "$MARKDOWN" "$SHELLCHECK" "$SYNTAX" "$PREFLIGHT" "$SMOKE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
