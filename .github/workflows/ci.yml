name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  markdown_and_links:
    name: Markdown lint and link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown lint
        run: ./scripts/lint_markdown.sh

      - name: Markdown link check
        run: ./scripts/check_markdown_links.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    needs: markdown_and_links
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  bash_syntax:
    name: Bash syntax validation
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash -n all scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

  vm_preflight:
    name: VM preflight checks
    runs-on: ubuntu-latest
    needs: bash_syntax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run preflight in strict mode
        run: ./scripts/vm_preflight.sh --strict

  scripts_smoke:
    name: Script smoke tests
    runs-on: ubuntu-latest
    needs: vm_preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke script
        run: ./scripts/smoke_test.sh
